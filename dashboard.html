<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - Follow Back</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js" defer></script>
</head>
<body>

    <nav>
        <a href="index.html">الرئيسية</a> | 
        <span id="userEmailDisplay">جاري التحميل...</span> |
        <button id="logoutBtn">تسجيل خروج</button>
    </nav>

    <h2>لوحة التحكم</h2>

    <div class="section">
        <h3>إضافة حسابك الخاص</h3>
        <form id="addAccountForm">
            <select id="platform">
                <option value="instagram">Instagram</option>
                <option value="tiktok">TikTok</option>
            </select><br><br>
            <input type="url" id="accountUrl" placeholder="رابط الحساب" required><br><br>
            <button type="submit">إضافة الحساب</button>
        </form>
    </div>

    <br>

    <div class="section">
        <p>نقاطك الحالية: <span id="userPoints">0</span></p>
        <button id="earnPointsBtn">كسب نقطة (شاهد حسابات الآخرين)</button>
    </div>

    <br>

    <div class="section">
        <button id="requestFollowersBtn">طلب متابعين (خصم 5 نقاط)</button>
    </div>

    <hr>
    <h3>حسابات للتبادل:</h3>
    <div id="accountsList">
        </div>

</body>
</html>
