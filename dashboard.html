<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الإحصائيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --bg-color: #f8fafc;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            display: flex;
        }
        /* القائمة الجانبية (نفس تصميم الصفحة الرئيسية لتوحيد الهوية) */
        .sidebar {
            width: 260px;
            background: #1e293b;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            display: block;
            border-radius: 8px;
            margin-bottom: 5px;
        }
        .sidebar a.active { background: var(--primary-color); color: white; }

        .main-content { margin-right: 260px; padding: 30px; width: 100%; }

        /* شبكة الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--primary-color);
        }
        .stat-card h3 { color: #64748b; font-size: 0.9rem; margin: 0; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: #1e293b; }

        /* جدول البيانات */
        .data-table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .data-table th, .data-table td { padding: 15px; text-align: right; border-bottom: 1px solid #f1f5f9; }
        .data-table th { background: #f8fafc; color: #64748b; }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .status-online { background: #dcfce7; color: var(--success-color); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color: white; text-align: center;">لوحة التحكم</h2>
        <nav>
            <a href="index.html">🏠 الرئيسية</a>
            <a href="dashboard.html" class="active">📊 الإحصائيات</a>
            <a href="login.html">🔑 خروج</a>
        </nav>
    </aside>

    <main class="main-content">
        <header style="margin-bottom: 30px;">
            <h1>نظرة عامة على البيانات</h1>
            <p>مرحباً بك مجدداً، إليك آخر التحديثات اليوم.</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>المستخدمين الجدد</h3>
                <div class="value">1,250</div>
            </div>
            <div class="stat-card" style="border-color: var(--success-color);">
                <h3>المبيعات</h3>
                <div class="value">$14,200</div>
            </div>
            <div class="stat-card" style="border-color: var(--warning-color);">
                <h3>الطلبات المعلقة</h3>
                <div class="value">45</div>
            </div>
        </section>

        <section>
            <h3>آخر النشاطات</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>المستخدم</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>أحمد محمد</td>
                        <td>2024-05-20</td>
                        <td><span class="status-badge status-online">نشط الآن</span></td>
                        <td><button style="cursor:pointer">تعديل</button></td>
                    </tr>
                    <tr>
                        <td>سارة خالد</td>
                        <td>2024-05-19</td>
                        <td><span class="status-badge status-online">نشط الآن</span></td>
                        <td><button style="cursor:pointer">تعديل</button></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
