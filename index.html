<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروعي الإحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            display: flex;
        }
        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background: #fff;
            height: 100vh;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
        }
        .sidebar h2 { color: var(--primary-color); text-align: center; }
        .nav-links { list-style: none; padding: 0; margin-top: 30px; }
        .nav-links li { margin: 15px 0; }
        .nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            display: block;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .nav-links a:hover { background: #f1f5f9; color: var(--primary-color); }
        
        /* المحتوى الرئيسي */
        .main-content {
            margin-right: 260px; /* لموازنة القائمة الجانبية في RTL */
            padding: 40px;
            width: 100%;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn {
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2>لوحة التحكم</h2>
        <ul class="nav-links">
            <li><a href="index.html">🏠 الرئيسية</a></li>
            <li><a href="dashboard.html">📊 الإحصائيات (Dashboard)</a></li>
            <li><a href="login.html">🔑 تسجيل الدخول</a></li>
            <li><a href="register.html">📝 إنشاء حساب</a></li>
        </ul>
        <div style="margin-top: auto;">
            <button class="btn" onclick="showAlert()">تحديث البيانات</button>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h1>أهلاً بك في تطبيقك الجديد</h1>
            <p>هذا الكود يربط ملفاتك: main.js و style.css بشكل احترافي.</p>
        </header>

        <section class="card-grid">
            <div class="card">
                <h3>حالة النظام</h3>
                <p>جميع الأنظمة تعمل بكفاءة عالية.</p>
            </div>
            <div class="card">
                <h3>الملفات المرتبطة</h3>
                <ul>
                    <li>dashboard.html</li>
                    <li>login.html</li>
                    <li>register.html</li>
                </ul>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
    <script>
        function showAlert() {
            alert("تم تفعيل الربط بين الملفات بنجاح!");
        }
    </script>
</body>
</html>
